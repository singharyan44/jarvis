model:
  name: microsoft/MiniLM-L6-H384-uncased
  type: effect_extraction
  num_labels: 10
  problem_type: multi_label_classification
  label_names:
  - filesystem_read
  - filesystem_write
  - filesystem_delete
  - process_spawn
  - network_read
  - network_write
  - credential_access
  - privilege_change
  - persistence
  - package_install
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules:
  - query
  - value
  - key
  - dense
training:
  epochs: 5
  batch_size: 8
  learning_rate: 3e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: true
  gradient_accumulation_steps: 2
  eval_steps: 500
  save_steps: 500
  logging_steps: 100
  early_stopping_patience: 3
  early_stopping_threshold: 0.001
  metric_for_best_model: f1_micro
data:
  max_length: 512
  train_file: data/train.jsonl
  val_file: data/val.jsonl
  test_file: data/test.jsonl
  redteam_file: data/redteam.jsonl
output:
  dir: results/minilm_l6_effect
  save_best: true
  save_total_limit: 2
